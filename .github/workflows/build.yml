name: Build job

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      git-ref:
        description: Git Ref (Optional)
        required: false
      dry-run:
        description: Creates a draft release
        required: false

env:
  ANIMIRU_GITHUB_RELEASE: true

jobs:
  get_commit_count:
    name: Extract commit count
    runs-on: 'ubuntu-26.04'
    outputs:
      commit-count: ${{ steps.get_commit_count.outputs.commit-count }}
      current-sha: ${{ steps.get_commit_count.outputs.current-sha }}
      prev-tag: ${{ steps.get_commit_count.outputs.prev-tag }}
    steps:
      - name: Clone Repository (Latest)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'quickdesh/Animiru'
          fetch-depth: 0
          filter: blob:none
        if: github.event.inputs.git-ref == ''

      - name: Clone Repository (Custom Ref)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'quickdesh/Animiru'
          fetch-depth: 0
          filter: blob:none
          ref: ${{ github.event.inputs.git-ref }}
        if: github.event.inputs.git-ref != ''

      - name: Get commit count
        id: get_commit_count
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          commit_count=$(git rev-list --count HEAD)
          echo "commit-count=$commit_count" >> $GITHUB_OUTPUT
          echo "current-sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

          tag_name=$(gh release list --repo animiruorg/animiru-preview --exclude-drafts --exclude-pre-releases --json tagName --limit 1 --jq 'select(length > 0) | .[0].tagName')
          if [ -n "$tag_name" ]; then
            echo "Latest Tag: $tag_name"
          else
            echo "Failed to get repository information"
            exit 1
          fi
          echo "prev-tag=$tag_name" >> $GITHUB_OUTPUT

  build:
    name: Build app
    needs: get_commit_count
    runs-on: 'ubuntu-26.04'
    env:
      COMMIT_COUNT: ${{ needs.get_commit_count.outputs.commit-count }}
      CURRENT_SHA: ${{ needs.get_commit_count.outputs.current-sha }}
      PREV_TAG: ${{ needs.get_commit_count.outputs.prev-tag }}
    steps:
      - name: Clone Repository (Latest)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'quickdesh/Animiru'
          fetch-depth: 0
        if: github.event.inputs.git-ref == ''

      - name: Clone Repository (Custom Ref)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event.inputs.git-ref != ''
        with:
          repository: 'quickdesh/Animiru'
          fetch-depth: 0
          ref: ${{ github.event.inputs.git-ref }}

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 25
          distribution: temurin

      # AM (SYNC_DRIVE) -->
      - name: Write client_secrets.json
        uses: DamianReeves/write-file-action@v1.2
        with:
          path: app/src/main/assets/client_secrets.json
          contents: ${{ secrets.CLIENT_SECRETS_TEXT }}
          write-mode: overwrite
      # <-- AM (SYNC_DRIVE)

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build APK
        run: ./gradlew assemblePreview -Pinclude-cast -Penable-updater
        env:
          storeFileBase64: ${{ secrets.SIGNING_KEY }}
          storePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias: ${{ secrets.ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          prev_commit_count=$(echo "${{ env.PREV_TAG }}" | sed -e "s/^r//")
          commit_count_diff=$(expr ${{ env.COMMIT_COUNT }} - $prev_commit_count)
          prev_release_sha=$(git rev-parse --short HEAD~$commit_count_diff)
          echo "PREV_RELEASE_SHA=$prev_release_sha" >> $GITHUB_ENV

          echo "COMMIT_LOGS<<{delimiter}
          $(curl -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/quickdesh/Animiru/compare/$prev_release_sha...${{ env.CURRENT_SHA }}" \
            | jq '[.commits[]|{message:(.commit.message | split("\n")), username:.author.login}]' \
            | jq -r '.[]|"- \(.message | first) (@\(.username))"')
          {delimiter}" >> $GITHUB_ENV

      - name: Rename APK
        run: |
          set -e

          mv app/build/outputs/apk/preview/app-universal-preview.apk animiru-r${{ env.COMMIT_COUNT }}.apk
          mv app/build/outputs/apk/preview/app-arm64-v8a-preview.apk animiru-arm64-v8a-r${{ env.COMMIT_COUNT }}.apk
          mv app/build/outputs/apk/preview/app-armeabi-v7a-preview.apk animiru-armeabi-v7a-r${{ env.COMMIT_COUNT }}.apk
          mv app/build/outputs/apk/preview/app-x86-preview.apk animiru-x86-r${{ env.COMMIT_COUNT }}.apk
          mv app/build/outputs/apk/preview/app-x86_64-preview.apk animiru-x86_64-r${{ env.COMMIT_COUNT }}.apk

      - name: Create Github Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: r${{ env.COMMIT_COUNT }}
          name: Animiru Preview r${{ env.COMMIT_COUNT }}
          body: |
            ### Commits

            https://github.com/quickdesh/Animiru/compare/${{ env.PREV_RELEASE_SHA }}...${{ env.CURRENT_SHA }}

            ${{ env.COMMIT_LOGS }}

            <!-->
            > [!TIP]
            >
            > ### If you are unsure which version to download then go with `animiru-r${{ env.COMMIT_COUNT }}.apk`
          files: |
            animiru-r${{ env.COMMIT_COUNT }}.apk
            animiru-arm64-v8a-r${{ env.COMMIT_COUNT }}.apk
            animiru-armeabi-v7a-r${{ env.COMMIT_COUNT }}.apk
            animiru-x86-r${{ env.COMMIT_COUNT }}.apk
            animiru-x86_64-r${{ env.COMMIT_COUNT }}.apk
          draft: ${{ github.event.inputs.dry-run != '' }}
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prune old releases
        uses: dev-drprasad/delete-older-releases@dfbe6be2a006e9475dfcbe5b8d201f1824c2a9fe # v0.3.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          keep_latest: 365
          delete_tags: true
